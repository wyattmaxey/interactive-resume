<!DOCTYPE html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro&display=swap" rel="stylesheet">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path fill=%22%23006AFF%22 d=%22M85.33,12.67H66V4h-8v8.67H42V4h-8v8.67H14.67C10.2,12.67,6.67,16.2,6.67,20.67v64.66C6.67,89.8,10.2,93.33,14.67,93.33h70.66c4.47,0,8-3.53,8-7.93V20.67C93.33,16.2,89.8,12.67,85.33,12.67z M42,82.67h-8V66h-6.67v-8H42V82.67z M42,50h-8v-8h8V50z M66,82.67H42v-8h24V82.67z%22/></svg>">
    </head>

    <style type="text/css">
        .node circle {
            stroke-width: 2px;
            transition: stroke-width 0.2s ease-in-out;
        }
        .node:hover circle {
            stroke-width: 5px;
            cursor: pointer;
        }
        #tooltip {
            position: absolute;
            padding: 8px;
            font: 12px "Anonymous Pro", monospace;
            background: #fff;
            border: 1px solid #D8D8D8; /* lightGray */
            color: #2A2A2A; /* darkText */
            border-radius: 4px;
            pointer-events: none; /* Prevents tooltip from blocking mouse events */
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 300px;
            word-wrap: break-word;
        }
    </style>

    <body>
        <div id="app">
            <div id="tree-graph"></div>
        </div>
        <!-- Tooltip div, initially hidden -->
        <div id="tooltip"></div>
    </body>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        var margin = {
            top: 20,
            right: 120, // Provide space for labels on the right
            bottom: 20,
            left: 120  // Provide space for labels on the left
        },
        width = window.innerWidth - margin.left - margin.right,
        height = window.innerHeight - margin.top - margin.bottom;

        var svg = d3.select("#tree-graph").append("svg")
            .attr("width", width + margin.right + margin.left)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
        
        var url = "resume_2025.json";

        d3.json(url).then(function(data) {
            // Restructure the flat JSON data into a hierarchical format for D3
            const root = {
                name: data.basics.name,
                children: []
            };

            // Work Experience
            const workNode = { name: data.headings.work, children: [] };
            data.work.forEach(job => {
                if (job.company) { // Skip empty entries
                    const jobNode = {
                        name: `${job.position} @ ${job.company}`,
                        children: job.highlights.map(h => ({ name: h }))
                    };
                    workNode.children.push(jobNode);
                }
            });
            root.children.push(workNode);

            // Skills
            const skillsNode = { name: data.headings.skills, children: [] };
            data.skills.forEach(skillCat => {
                // Handle the "(cont)" entries by merging with the previous category
                if (skillCat.name === "(cont)" && skillsNode.children.length > 0) {
                    const prevNode = skillsNode.children[skillsNode.children.length - 1];
                    prevNode.children.push(...skillCat.keywords.map(k => ({ name: k })));
                } else {
                    const skillCatNode = {
                        name: skillCat.name,
                        children: skillCat.keywords.map(k => ({ name: k }))
                    };
                    skillsNode.children.push(skillCatNode);
                }
            });
            root.children.push(skillsNode);

            // Projects
            const projectsNode = { name: data.headings.projects, children: [] };
            data.projects.forEach(proj => {
                const projNode = {
                    name: proj.name,
                    // The description can be added as a property if needed later
                    // description: proj.description, 
                    children: proj.keywords.map(k => ({ name: k }))
                };
                projectsNode.children.push(projNode);
            });
            root.children.push(projectsNode);

            // Education
            const educationNode = { name: data.headings.education, children: [] };
            data.education.forEach(edu => {
                educationNode.children.push({ name: `${edu.studyType} in ${edu.area} @ ${edu.institution}` });
            });
            root.children.push(educationNode);

            // Awards / Certifications
            const awardsNode = { name: data.headings.awards, children: [] };
            data.awards.forEach(award => {
                awardsNode.children.push({ name: `${award.title} from ${award.awarder}` });
            });
            root.children.push(awardsNode);

            console.log(root); // Log the new hierarchical structure to the console

            // Color palette
            const primaryColor = "#006AFF";
            const darkText = "#2A2A2A";
            const lightGray = "#D8D8D8";

            var treemap = d3.tree().size([height, width]);
            var root_node = d3.hierarchy(root)
                i = 0
                duration = 750;
            root_node.x0 = height / 2;
            root_node.y0 = 0;

            if (root_node.children) root_node.children.forEach(collapse);

            update(root_node);

            function collapse(d) {
                if (d.children) {
                    d._children = d.children;
                    d._children.forEach(collapse);
                    d.children = null;
                }
            }

            function update(source) {
                var treeData = treemap(root_node);
                var nodes = treeData.descendants(),
                    links = treeData.links();

                nodes.forEach(function(d) {
                    d.y = d.depth * 180;
                });

                var node = svg.selectAll("g.node")
                    .data(nodes, function(d) { return d.id || (d.id = ++i); });

                var nodeEnter = node.enter().append("g")
                    .attr("class", "node")
                    .attr("transform", function(d) {
                        return "translate(" + source.y0 + "," + source.x0 + ")";
                    })
                    .on("click", (event, d) => click(d))
                    .on("mouseover", function(event, d) {
                        if (d.data.name.length > 64) {
                            tooltip.transition()
                                .duration(200)
                                .style("opacity", .9);
                            tooltip.html(d.data.name)
                                .style("left", (event.pageX + 15) + "px")
                                .style("top", (event.pageY - 28) + "px");
                        }
                    })
                    .on("mouseout", function(d) {
                        tooltip.transition()
                            .duration(500)
                            .style("opacity", 0);
                    });

                nodeEnter.append('circle')
                    .attr("r", 1e-6)
                    .style("fill", function(d) {
                        return d._children ? primaryColor : "#fff";
                    })
                    .style("stroke", primaryColor);

                    nodeEnter.append('text')
                        .attr('x', 0)
                        .attr('dy', '1.45em')
                        .attr('text-anchor', 'middle')
                        .text(function(d) {
                            const name = d.data.name;
                            return name.length > 50 ? name.substring(0, 47) + "..." : name;
                        })
                        .style('fill', darkText)
                        .style('font', '12px Anonymous Pro');

                var nodeUpdate = nodeEnter.merge(node);
                nodeUpdate.transition()
                    .duration(duration)
                    .attr("transform", function(d) {
                        return "translate(" + d.y + "," + d.x + ")";
                    });

                nodeUpdate.select('circle')
                    .attr("r", 10)
                    .style('fill', function(d) {
                        return d._children ? primaryColor : '#fff';
                    });

                var nodeExit = node.exit().transition()
                    .duration(duration)
                    .attr("transform", function(d) {
                        return "translate(" + source.y + "," + source.x + ")";
                    })
                    .remove();

                nodeExit.select('circle')
                    .attr("r", 1e-6);

                nodeExit.select('text')
                    .style('fill-opacity', 1e-6);


                // Define the tooltip
                var tooltip = d3.select("#tooltip");

                var link = svg.selectAll("path.link")
                    .data(links, function(d) { return d.target.id; });

                link.enter().insert("path", "g")
                    .attr("class", "link")
                    .attr("d", function(d) {
                        var o = { x: source.x0, y: source.y0 };
                        return diagonal(o, o); // Draw from source to source initially
                    })
                    .style("fill", "none") // Links should not be filled
                    .style("stroke", "#ccc")
                    .style("stroke-width", "2px")
                    .merge(link)
                    .transition()
                    .duration(duration)
                    .attr("d", function(d) {
                        return diagonal(d.source, d.target); // Transition to final position
                    })
                    .style("stroke", lightGray);

                link.exit().transition()
                    .duration(duration)
                    .attr("d", function(d) {
                        var o = { x: source.x, y: source.y };
                        return diagonal(o, o);
                    })
                    .remove();

                // Stash the old positions for transition.
                nodes.forEach(function(d) {
                    d.x0 = d.x;
                    d.y0 = d.y;
                });
            }

            function diagonal(s, d) {
                return "M" + s.y + "," + s.x
                    + "C" + (s.y + d.y) / 2 + "," + s.x
                    + " " + (s.y + d.y) / 2 + "," + d.x
                    + " " + d.y + "," + d.x;
            }

            function click(d) { // 'd' is the node data object
                if (d.children) {
                    d._children = d.children;
                    d.children = null;
                } else {
                    d.children = d._children;
                    d._children = null;
                }
                update(d);
            }
        });

    </script>
